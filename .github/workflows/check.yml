name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publish-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_publish.py --all
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anima-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          python-version: '3.13'
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - name: Run backend tests when present
        if: ${{ hashFiles('anima-server/tests/**/test_*.py') != '' }}
        run: uv run --locked --extra dev pytest -q tests
