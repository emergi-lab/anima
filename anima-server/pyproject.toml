[project]
name = "anima-server"
version = "0.0.1"
description = "Anima desktop-pet backend: persona distillation plus the EMERGI-PersonaOS lifecycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "openai>=1.70,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
anima-api = "persona_os.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_os"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
