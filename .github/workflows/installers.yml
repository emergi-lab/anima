name: Installers from release

# Add installers around the EXACT already-published ZIP payloads, without
# moving a release tag, replacing ZIPs, or rebuilding application binaries.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag
        required: true
        default: v0.0.1
      publish:
        description: Add the tested installers to this release (never overwrite assets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Installer ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer unit tests
        run: python -m unittest discover -s tools/tests -p test_build_installers.py -v
      - name: Prepare NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $compiler)) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path $compiler)) { throw 'makensis.exe not found' }
          "MAKENSIS=$compiler" >> $env:GITHUB_ENV
          & $compiler /VERSION
      - name: Download original release payload and build tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["TAG"]), "Invalid release tag"'
          gh release view "$TAG" --json isDraft > release.json
          python -c 'import json; assert not json.load(open("release.json"))["isDraft"], "Source release must be published"'
          VERSION="${TAG#v}"
          NAME="Anima-${VERSION}-${TARGET}"
          gh release download "$TAG" --pattern "$NAME.zip" --pattern "$NAME.zip.sha256" --dir input
          python tools/build_installers.py --target "$TARGET" --version "$VERSION" --archive "input/$NAME.zip" --checksum "input/$NAME.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Installer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Add installers to published release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Installer-*
          merge-multiple: true
          path: packages
      - name: Verify complete set and append only (no clobber)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Invalid tag'
          release = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{os.environ["GH_REPO"]}/releases/tags/{tag}']))
          assert release['tag_name'] == tag and not release['draft']
          existing = {asset['name']: asset for asset in release['assets']}
          base = f'Anima-{tag[1:]}'
          installers = [f'{base}-windows-x64-setup.exe',
                        f'{base}-macos-arm64.dmg', f'{base}-macos-x64.dmg']
          expected = set(installers + [name + '.sha256' for name in installers])
          paths = list(Path('packages').iterdir())
          assert {p.name for p in paths} == expected, 'Incomplete installer set'
          hashes = {}
          for path in paths:
              assert path.is_file() and not path.is_symlink()
              with path.open('rb') as stream:
                  hashes[path.name] = hashlib.file_digest(stream, 'sha256').hexdigest()
          for name in installers:
              fields = Path('packages', name + '.sha256').read_text().split()
              assert fields == [hashes[name], name], f'Checksum mismatch: {name}'
          for name in expected & existing.keys():
              assert existing[name]['digest'] == 'sha256:' + hashes[name], (
                  f'Existing asset differs; refusing to overwrite: {name}')
          for name in sorted(expected - existing.keys()):
              subprocess.run(['gh', 'release', 'upload', tag, str(Path('packages', name))],
                             check=True)
          PY
