name: check
on: [push, pull_request]
jobs:
  publish-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_publish.py --all
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anima-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
