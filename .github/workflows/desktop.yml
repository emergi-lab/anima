name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          python-version: '3.13'
          enable-cache: true
      - id: version
        name: Validate version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          uv run --python 3.13 --no-project python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('anima-server/pyproject.toml').read_text())['project']['version']
          tag = os.environ['TAG']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Project version must be MAJOR.MINOR.PATCH')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match project version v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: python tools/check_publish.py --all
      - run: uv sync --project anima-server --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
        working-directory: anima-server
      - run: uv run --project anima-server --locked --extra dev ruff check --config anima-server/pyproject.toml tools/build_desktop.py tools/setup_godot.py tools/desktop_launcher.py tools/tests/test_desktop_launcher.py tools/tests/test_setup_godot.py tools/tests/test_build_desktop.py tools/build_installers.py tools/tests/test_build_installers.py
      - name: Run backend tests when present
        if: ${{ hashFiles('anima-server/tests/**/test_*.py') != '' }}
        run: uv run --project anima-server --locked --extra dev pytest -q anima-server/tests
      - run: uv run --project anima-server --locked --extra dev python -m unittest discover -s tools/tests -v

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            installer: -setup.exe
          - os: macos-15
            target: macos-arm64
            installer: .dmg
          - os: macos-15-intel
            target: macos-x64
            installer: .dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          python-version: '3.13'
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --project anima-server --locked --no-dev
      - name: Install verified Godot editor and export templates
        id: godot
        run: uv run --project anima-server --locked python tools/setup_godot.py --version 4.7.2
      - name: Freeze backend, export client and test payload
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: uv run --project anima-server --locked --with pyinstaller==6.20.0 python tools/build_desktop.py --godot "$GODOT" --target "$TARGET" --version "$VERSION"
      - name: Prepare NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $compiler)) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path $compiler)) { throw 'makensis.exe not found' }
          "MAKENSIS=$compiler" >> $env:GITHUB_ENV
          & $compiler /VERSION
      - name: Build and installation-test native installer
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: uv run --project anima-server --locked python tools/build_installers.py --target "$TARGET" --version "$VERSION" --package ".build/$TARGET/Anima-$VERSION-$TARGET"
      - name: Upload downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: Anima-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: dist/Anima-${{ needs.validate.outputs.version }}-${{ matrix.target }}${{ matrix.installer }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: .build/${{ matrix.target }}/smoke-logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Prepare release draft
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Anima-*
          merge-multiple: true
          path: packages
      - name: Verify installer-only assets and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          base = 'Anima-' + os.environ['VERSION']
          names = [base + '-windows-x64-setup.exe',
                   base + '-macos-arm64.dmg', base + '-macos-x64.dmg']
          expected = set(names + [name + '.sha256' for name in names])
          assert {p.name for p in Path('packages').iterdir()} == expected, 'Unexpected release assets'
          for name in names:
              with Path('packages', name).open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert Path('packages', name + '.sha256').read_text().split() == [digest, name]
          PY
      - name: Create or update draft (never silently replace a published release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Release is already published; refusing to overwrite assets"'
          else
            gh release create "$TAG" --verify-tag --draft --title "Anima $TAG" \
              --notes 'Windows x64 安装向导（-setup.exe）、macOS Apple Silicon / Intel 安装镜像（.dmg），仅提供安装包与 SHA-256，不提供便携 ZIP。内含 Godot 和 Python 后端，无需安装开发环境。Windows 双击安装；Mac 打开 DMG，将 Anima 拖到 Applications。未使用 Windows 商业代码签名或 Apple Developer ID 公证，首次打开可能出现系统安全提示；接口 URL、模型名和 API Key 默认留空，需在设置中自行配置。'
          fi
          gh release upload "$TAG" packages/* --clobber
